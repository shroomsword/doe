name: Build the web IDE
description: >-
  Builds web/dist: the library for WebAssembly (crates/doe-wasm), its glue and the page. Used by the Pages
  and release workflows. The checkout must already be there.
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      with:
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        key: web
    # The version must be the one of the wasm-bindgen crate (crates/doe-wasm/Cargo.toml).
    - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
      with:
        tool: wasm-bindgen@0.2.129
    - name: Install the dependencies
      shell: bash
      working-directory: web
      run: npm ci
    - name: Build
      shell: bash
      working-directory: web
      run: npm run build
