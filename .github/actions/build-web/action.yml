name: Build the web IDE
description: >-
  Builds web/dist: the library for WebAssembly (crates/doe-wasm), its glue and the page. Used by the Pages
  and release workflows. The checkout must already be there.
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      with:
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        key: web
    # The version must be the one of the wasm-bindgen crate (crates/doe-wasm/Cargo.toml).
    - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
      with:
        tool: wasm-bindgen@0.2.130
    - name: Install the dependencies
      shell: bash
      working-directory: web
      run: npm ci
    - name: Build
      shell: bash
      working-directory: web
      run: npm run build
