name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  BIN: doe # executable name
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: tag
        name: Verify tag
        env:
          TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # actions/checkout rewrites the tag ref; fetch it again so the annotated tag object is present.
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag ${TAG} is not a semantic version"
            exit 1
          fi
          if [[ "$(git cat-file -t "refs/tags/${TAG}")" != "tag" ]]; then
            echo "::error::Tag ${TAG} is not an annotated tag"
            exit 1
          fi
          if ! git merge-base --is-ancestor "${TAG}^{commit}" "origin/${DEFAULT_BRANCH}"; then
            echo "::error::Tag ${TAG} does not point at a commit on ${DEFAULT_BRANCH}"
            exit 1
          fi
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          if [[ -n "${BASH_REMATCH[4]}" ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  # Runs the full CI workflow on the tagged commit. The checks are defined only in ci.yml.
  checks:
    needs: verify
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml

  # The web IDE is built once, on Linux, and put in every binary (doe --ide).
  web:
    needs: [verify, checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gallery picker lists the formats of this submodule and the commit it is at.
          submodules: true
      - uses: ./.github/actions/build-web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  build:
    needs: [verify, checks, web]
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            native: true
          - os: macos-latest
            target: aarch64-apple-darwin
            native: true
          # The runner is Apple Silicon: this binary is built there but not run.
          - os: macos-latest
            target: x86_64-apple-darwin
            native: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            native: true
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      NATIVE: ${{ matrix.native }}
      # The build fails when the page is not there to be put in the binary (crates/doe-cli/build.rs).
      DOE_IDE_REQUIRE_BUNDLE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.target }}

      # Builds the features that ship (the defaults, unless the project says otherwise) with the release profile:
      # LTO, one codegen unit, stripped, overflow checks on.
      - name: Build
        run: cargo build --workspace --release --locked --target "$TARGET"

      # doe --ide serves the page that is in the binary: fetch it and see that it is the IDE.
      - name: Check that the web IDE is in the binary
        if: env.NATIVE == 'true'
        run: |
          set -euo pipefail
          ext=""
          if [[ "$TARGET" == *windows* ]]; then
            ext=".exe"
          fi
          log="$RUNNER_TEMP/ide.log"
          "target/${TARGET}/release/${BIN}${ext}" --ide --port 0 > "$log" &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          url=""
          for _ in $(seq 1 50); do
            url="$(grep -o 'http://[^ ]*' "$log" | head -1 || true)"
            if [[ -n "$url" ]]; then break; fi
            sleep 0.2
          done
          if [[ -z "$url" ]]; then
            echo "::error::doe --ide did not print an address"
            cat "$log"
            exit 1
          fi
          curl -fsS "$url" | grep -q '<script type="module" src="./main.js">'
          curl -fsS "${url}doe_wasm_bg.wasm" -o "$RUNNER_TEMP/doe.wasm"
          test "$(head -c 4 "$RUNNER_TEMP/doe.wasm" | od -An -tx1 | tr -d ' \n')" = "0061736d"

      - name: Stage binary
        run: |
          set -euo pipefail
          ext=""
          if [[ "$TARGET" == *windows* ]]; then
            ext=".exe"
          fi
          mkdir -p out
          cp "target/${TARGET}/release/${BIN}${ext}" out/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  release:
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.verify.outputs.version }}
      PRERELEASE: ${{ needs.verify.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          path: bins

      # Generated once, from the Linux binary, and included in every archive.
      - name: Completions and man page
        run: |
          set -euo pipefail
          host="bins/bin-x86_64-unknown-linux-gnu/${BIN}"
          chmod +x "$host"
          mkdir -p extras/complete extras/doc
          "$host" --completions bash > "extras/complete/${BIN}.bash"
          "$host" --completions zsh > "extras/complete/_${BIN}"
          "$host" --completions fish > "extras/complete/${BIN}.fish"
          "$host" --completions powershell > "extras/complete/_${BIN}.ps1"
          "$host" --completions elvish > "extras/complete/${BIN}.elv"
          "$host" --man=doe > "extras/doc/${BIN}.1"
          "$host" --man=schema > "extras/doc/${BIN}-schema.5"

      - name: Package
        run: |
          set -euo pipefail
          shopt -s nullglob
          licenses=(LICENSE*)
          mkdir -p dist stage
          for dir in bins/bin-*; do
            target="${dir#bins/bin-}"
            name="${BIN}-${TAG}-${target}"
            mkdir -p "stage/${name}"
            cp "$dir"/* "stage/${name}/"
            cp README.md "stage/${name}/"
            if [[ ${#licenses[@]} -gt 0 ]]; then
              cp "${licenses[@]}" "stage/${name}/"
            fi
            cp -r extras/complete extras/doc "stage/${name}/"
            if [[ "$target" == *windows* ]]; then
              (cd stage && zip -qr "../dist/${name}.zip" "$name")
            else
              # Artifact upload drops the executable bit; restore it before archiving.
              chmod +x "stage/${name}/${BIN}"
              tar -C stage -czf "dist/${name}.tar.gz" "$name"
            fi
          done
          ls -l dist

      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Create draft release
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::A release for ${TAG} already exists"
            exit 1
          fi
          flags=(--draft --verify-tag --generate-notes --title "$TAG")
          if [[ "$PRERELEASE" == "true" ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" "${flags[@]}"

      - name: Upload artifacts
        run: gh release upload "$TAG" dist/*

      - name: Publish
        run: gh release edit "$TAG" --draft=false
