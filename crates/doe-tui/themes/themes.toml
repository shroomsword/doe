# The built-in themes of the web IDE and the terminal viewer: the one table both
# are made from. The terminal viewer reads this file as it is (it is compiled
# in); the web IDE has `web/src/themes.generated.ts`, which is made from it by
# `DOE_UPDATE_GENERATED=1 cargo test -p doe-tui --test themes` (a test fails when
# the generated file is out of date).
#
# Each theme has an `id` (what `--theme` takes), a `name`, a `variant` (`dark`
# or `light`), where it comes from (`author`, `license`, `source`) and its
# colours, which are named for what they are used for, not for the widget:
#
#   background, foreground   the text and what it is on
#   muted                    secondary text, offsets, instances
#   line, panel              borders, and the background of headings and hovers
#   accent                   the focus, links, the names of types
#   selection                the selected row and bytes
#   selection_part           a byte that is only partly in the selected field
#   error, warning           a parse that failed, and what is not wrong but odd
#   number, string, bytes,   the values in the tree, by kind
#   enum, boolean, offset
#   type                     the name of a type
#   instance                 an instance, which is computed and not read in order
#
# A colour is `#rrggbb`. The tests check that the foreground and the error
# colour are 4.5:1 (WCAG AA) on the background in every theme. Where a theme's
# own colour is lower than that, the colour is made lighter or darker until it is,
# and the theme says so in `note`.

[[theme]]
id = "doe-light"
name = "doe Light"
variant = "light"
author = "the doe project"
license = "MIT"
source = "https://github.com/shroomsword/doe"
[theme.colors]
background = "#ffffff"
foreground = "#1d2127"
muted = "#66707c"
line = "#d6dae0"
panel = "#f6f7f9"
accent = "#1a6fd4"
selection = "#cfe3fb"
selection_part = "#e5f0fd"
error = "#c0261e"
warning = "#8a5a00"
number = "#9a5b00"
string = "#1a7f37"
bytes = "#b4411f"
enum = "#8250df"
boolean = "#0a7d8c"
offset = "#66707c"
type = "#1a6fd4"
instance = "#66707c"

