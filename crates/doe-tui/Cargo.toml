[package]
name = "doe-tui"
version = "0.7.0"
description = "doe — terminal viewer for decoded binary files"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
doe = { version = "0.7.0", path = "../doe" }
anyhow = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["std", "derive"] }
toml = { workspace = true, features = ["std", "parse", "serde"] }
log.workspace = true
ratatui = { workspace = true, features = ["crossterm"] }
crossterm = { workspace = true, features = ["events", "bracketed-paste"] }
# The preview of a file of an archive: the grammars that come with it, read with its regex engine in Rust (no C library).
# Its colour themes are not used: the scopes are mapped onto the colours of the viewer's own theme.
# Markdown entries of an archive, rendered (the same parser as the manual pages are made with).
pulldown-cmark.workspace = true
syntect = { workspace = true, features = ["default-syntaxes", "regex-fancy"] }
unicode-width.workspace = true
unicode-segmentation.workspace = true
# The schema that --build makes is written to a temporary directory for the viewer to parse with.
tempfile.workspace = true
toml_edit = "0.25.17"

[target.'cfg(unix)'.dependencies]
signal-hook.workspace = true

[dev-dependencies]
serde_json = { workspace = true, features = ["std"] }

[lints]
workspace = true
