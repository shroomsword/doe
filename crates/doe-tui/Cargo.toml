[package]
name = "doe-tui"
version = "0.6.0"
description = "doe — terminal viewer for decoded binary files"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
doe = { version = "0.6.0", path = "../doe" }
anyhow = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["std", "derive"] }
toml = { workspace = true, features = ["std", "parse", "serde"] }
log.workspace = true
ratatui = { workspace = true, features = ["crossterm"] }
crossterm = { workspace = true, features = ["events", "bracketed-paste"] }
unicode-width.workspace = true
unicode-segmentation.workspace = true
# The schema that --build makes is written to a temporary directory for the viewer to parse with.
tempfile.workspace = true
toml_edit = "0.25.17"

[target.'cfg(unix)'.dependencies]
signal-hook.workspace = true

[dev-dependencies]
serde_json = { workspace = true, features = ["std"] }

[lints]
workspace = true
