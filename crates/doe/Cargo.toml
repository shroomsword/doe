[package]
name = "doe"
version = "0.1.0"
description = "Binary file parser driven by YAML type definitions"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
serde = { workspace = true, features = ["std", "derive"] }
serde-saphyr = { workspace = true, features = ["deserialize"] }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
etcetera.workspace = true
log.workspace = true
toml = { workspace = true, features = ["std", "parse", "serde"] }
indexmap = { workspace = true, features = ["std", "serde"] }
encoding_rs = { workspace = true, features = ["alloc"] }
flate2 = { workspace = true, features = ["rust_backend"] }

[dev-dependencies]
indoc.workspace = true
tempfile.workspace = true

[lints]
workspace = true
