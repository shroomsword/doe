[package]
name = "doe"
version = "0.7.0"
description = "Binary file parser driven by YAML type definitions"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["fs"]
# Everything that reads the filesystem or the user's configuration: the
# configuration file, `parse_file`, a file as the input of a parse, and the
# filesystem as the place schemas are imported from. Off, the library is for a
# program that has none (WebAssembly in a browser) and takes schemas from a
# `MemorySource` and input from a byte slice.
fs = ["dep:etcetera", "dep:toml"]

[dependencies]
serde = { workspace = true, features = ["std", "derive"] }
serde-saphyr = { workspace = true, features = ["deserialize"] }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
etcetera = { workspace = true, optional = true }
log.workspace = true
toml = { workspace = true, optional = true, features = ["std", "parse", "serde"] }
indexmap = { workspace = true, features = ["std", "serde"] }
encoding_rs = { workspace = true, features = ["alloc"] }
flate2 = { workspace = true, features = ["rust_backend"] }
# The checksum column of the Files view (pure Rust, so it builds for WebAssembly).
md-5.workspace = true
sha1.workspace = true
sha2.workspace = true
# `process: brotli` and the payload of a .br file (pure Rust; its static dictionary of 122,784 bytes is compiled in).
brotli-decompressor = { workspace = true, features = ["std"] }
# `process: bzip2 | xz | lzma | zstd` and the payload of the files of those formats (pure Rust).
bzip2.workspace = true
lzma-rust2 = { workspace = true, features = ["std", "xz", "lzip"] }
ruzstd = { workspace = true, features = ["std", "hash"] }

# The tests read files, the configuration and file-backed input.
[[test]]
name = "integration"
path = "tests/integration/main.rs"
required-features = ["fs"]

[dev-dependencies]
indoc.workspace = true
tempfile.workspace = true

[lints]
workspace = true
