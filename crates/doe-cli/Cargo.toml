[package]
name = "doe-cli"
version = "0.3.0"
description = "doe — binary file parser"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "doe"
path = "src/main.rs"

[features]
default = ["ide", "tui"]
# `doe --ide`: a local web server with the web IDE (web/) built into the binary.
# The page is taken from web/dist (or DOE_IDE_DIST) when the binary is built;
# without it a page that says so is embedded. No dependencies are needed.
ide = ["dep:serde_json"]
# `doe --tui`: the viewer in the terminal (crates/doe-tui).
tui = ["dep:doe-tui"]

[dependencies]
doe = { version = "0.3.0", path = "../doe" }
doe-tui = { version = "0.3.0", path = "../doe-tui", optional = true }
anyhow = { workspace = true, features = ["std"] }
anstream = { workspace = true, features = ["auto", "wincon"] }
anstyle = { workspace = true, features = ["std"] }
clap = { workspace = true, features = ["std", "derive", "help", "usage", "error-context", "color"] }

clap_complete.workspace = true
clap_mangen.workspace = true
pulldown-cmark.workspace = true
clap-verbosity-flag = { workspace = true, features = ["log"] }
etcetera.workspace = true
fern.workspace = true
humantime.workspace = true
log.workspace = true
serde_json = { workspace = true, features = ["std"], optional = true }

[dev-dependencies]
# A pseudo-terminal, to run `doe --tui` as a person's terminal would.
portable-pty.workspace = true
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
serde_json = { workspace = true, features = ["std"] }

[lints]
workspace = true
