[package]
name = "doe-cli"
version = "0.1.0"
description = "Command-line interface for doe"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "doe"
path = "src/main.rs"

[dependencies]
doe = { path = "../doe" }
clap = { workspace = true, features = ["std", "derive", "help", "usage", "error-context", "color"] }

[dev-dependencies]
tempfile.workspace = true
