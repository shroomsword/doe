[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fuzz"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/shroomsword/doe"
authors = ["shroomsword"]

# Every dependency is declared here once, with default features disabled. Members enable the features they need:
#   [dependencies]
#   clap = { workspace = true, features = ["std", "derive", "help", "usage", "error-context", "color"] }
[workspace.dependencies]
anyhow = { version = "1", default-features = false }
clap = { version = "4", default-features = false }
serde = { version = "1", default-features = false }
serde-saphyr = { version = "1", default-features = false }
serde_json = { version = "1", default-features = false }
thiserror = { version = "2", default-features = false }
etcetera = "0.11"
toml = { version = "1", default-features = false }
humantime = "2"
log = "0.4"
fern = { version = "0.7", default-features = false }
anstream = { version = "1", default-features = false }
anstyle = { version = "1", default-features = false }
clap_complete = "4"
clap_mangen = "0.3"
pulldown-cmark = { version = "0.13", default-features = false }
clap-verbosity-flag = { version = "3", default-features = false }
indexmap = { version = "2", default-features = false }
flate2 = { version = "1", default-features = false }
encoding_rs = { version = "0.8", default-features = false }
assert_cmd = "2"
indoc = "2"
predicates = { version = "3", default-features = false }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic opt-outs. Each needs a reason.
must_use_candidate = "allow" # fires on nearly every pure function; #[must_use] is applied deliberately instead
too_many_lines = "allow"     # no size limits on functions, modules, or files

# Restriction lints enforcing the no-panic, no-placeholder, and suppression rules.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unreachable = "warn"
todo = "warn"
unimplemented = "warn"
indexing_slicing = "warn"
string_slice = "warn"
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
exit = "warn"
allow_attributes_without_reason = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
overflow-checks = true
