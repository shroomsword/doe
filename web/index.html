<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>doe</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1>doe <small id="version"></small></h1>
      <div class="actions">
        <label id="types-box" hidden>Types <select id="types"></select></label>
        <button id="use-input" type="button" hidden></button>
      </div>
      <div class="actions">
        <label id="theme-box">Theme <select id="theme"></select></label>
        <label class="button" title="Load a theme file (TOML, as doe --tui reads it); it is kept in this browser">Load theme<input id="open-theme" type="file" accept=".toml" /></label>
      </div>
    </header>
    <main>
      <section id="pane-editor" aria-labelledby="h-schema">
        <div class="pane-title">
          <h2 id="h-schema">Schema <small id="editing"></small></h2>
          <div class="pane-actions">
            <label class="button" title="Load a schema file into the editor as the main schema, replacing its text. Imports that were added stay.">Open<input id="open-schema" type="file" accept=".ksy,.yaml,.yml" /></label>
            <label class="button" title="Add the schema files that the main schema imports (imports:). They are found by name; the main schema is not changed. A dropped .ksy or .yaml file does the same.">Add imports<input id="add-files" type="file" accept=".ksy,.yaml,.yml" multiple /></label>
            <button id="browse" type="button" title="List the types that can be used, filter them, read one and parse with it">Browse...</button>
          </div>
        </div>
        <div id="editor"></div>
        <p id="edit-note" hidden></p>
        <div id="schemas-box">
          <div class="schemas-head">
            <h3 id="h-schemas">Schemas</h3>
            <label id="type-box">Parse as <select id="parse-type"></select></label>
          </div>
          <ul id="schemas" aria-labelledby="h-schemas"></ul>
        </div>
      </section>
      <section id="pane-tree" aria-labelledby="h-parsed">
        <div class="pane-title">
          <h2 id="h-parsed">Parsed <small id="parsed-as"></small></h2>
          <div class="pane-actions">
            <label class="button" title="Open the binary file to parse. It is read in this browser and never uploaded.">Open<input id="open-input" type="file" /></label>
            <button id="detect" type="button" title="Find the schema of the opened file among the gallery (and the types of this machine, with doe --ide)">Detect</button>
            <label id="detect-auto-box" title="Detect the schema when a file is opened and the current one does not parse it"><input id="detect-auto" type="checkbox" /> auto</label>
            <button id="save" type="button" class="icon" disabled aria-label="Save" title="Save the parsed value as a file: choose the format and where"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false"><path fill="currentColor" d="M2 1h9l3 3v10a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1zm1 1v4h8V2H3zm1 8v4h8v-4H4zm5-7h1.5v3H9V3z"/></svg></button>
            <label id="field-radix-box" hidden title="Write this field, in every element and every parse of this schema, in a radix of its own">This field
              <select id="field-radix">
                <option value="">as above</option>
                <option value="dec">decimal</option>
                <option value="hex">hexadecimal</option>
                <option value="bin">binary</option>
                <option value="oct">octal</option>
              </select>
            </label>
            <label id="radix-box" title="How integers are written; the choice is kept in this browser">Integers
              <select id="radix">
                <option value="dec">decimal</option>
                <option value="hex">hexadecimal</option>
                <option value="bin">binary</option>
                <option value="oct">octal</option>
              </select>
            </label>
          </div>
        </div>
        <div id="detect-report" hidden></div>
        <div id="tree-box"><div id="tree"></div></div>
      </section>
      <section id="pane-hex" aria-labelledby="h-bytes">
        <div class="pane-title"><h2 id="h-bytes">Bytes <small id="selection"></small></h2></div>
        <div id="hex"></div>
      </section>
      <section id="pane-status" aria-labelledby="h-status">
        <div class="pane-title">
          <h2 id="h-status">Status</h2>
          <div class="pane-actions"><button type="button" id="cancel" hidden>Cancel parse</button></div>
        </div>
        <p id="status" role="status">loading…</p>
        <div id="problems"></div>
      </section>
    </main>
    <dialog id="browse-dialog" aria-labelledby="browse-title">
      <div class="browse-bar">
        <h3 id="browse-title">Types</h3>
        <label>Filter <input id="browse-filter" type="search" autocomplete="off" placeholder="name, path or doc" /></label>
        <label id="browse-rank-box"><input id="browse-rank" type="checkbox" /> Rank by the opened file</label>
        <span id="browse-count"></span>
        <button id="browse-close" type="button">Close</button>
      </div>
      <p id="browse-note" role="status"></p>
      <div id="browse-list"></div>
      <div id="browse-reader" hidden>
        <div class="browse-bar"><button id="browse-back" type="button">Back to the list</button><strong id="browse-reader-title"></strong></div>
        <pre id="browse-reader-text" tabindex="0"></pre>
      </div>
    </dialog>
    <dialog id="save-dialog" aria-labelledby="save-title">
      <div class="save-body">
        <h3 id="save-title">Save the parsed value</h3>
        <fieldset class="save-format">
          <legend>Format</legend>
          <label><input type="radio" name="save-format" value="text" checked /> Text <small>as doe prints it</small></label>
          <label><input type="radio" name="save-format" value="json" /> JSON <small>indented</small></label>
        </fieldset>
        <label class="save-name">File name <input id="save-name" type="text" autocomplete="off" spellcheck="false" /></label>
        <div class="save-place"><button id="save-browse" type="button" hidden>Browse...</button> <span id="save-place"></span></div>
        <p id="save-note" role="status"></p>
        <div class="save-buttons"><button id="save-go" type="button">Save</button><button id="save-cancel" type="button">Cancel</button></div>
      </div>
    </dialog>
    <script type="module" src="./main.js"></script>
  </body>
</html>
