<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>doe</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1>doe <small id="version"></small></h1>
      <div class="actions">
        <label class="button">Open schema<input id="open-schema" type="file" accept=".ksy,.yaml,.yml" /></label>
        <label class="button">Add imports<input id="add-files" type="file" accept=".ksy,.yaml,.yml" multiple /></label>
        <label class="button">Open file<input id="open-input" type="file" /></label>
        <button id="example" type="button">Example</button>
        <label id="types-box" hidden>Types <select id="types"></select></label>
        <button id="use-input" type="button" hidden></button>
      </div>
      <p id="status" role="status">loading…</p>
      <button type="button" id="cancel" hidden>Cancel parse</button>
    </header>
    <main>
      <section id="pane-editor" aria-labelledby="h-schema">
        <h2 id="h-schema">Schema</h2>
        <div id="editor"></div>
        <ul id="files" aria-label="imported files"></ul>
      </section>
      <section id="pane-tree" aria-labelledby="h-parsed">
        <h2 id="h-parsed">Parsed</h2>
        <div id="tree-box"><div id="tree"></div></div>
      </section>
      <section id="pane-hex" aria-labelledby="h-bytes">
        <h2 id="h-bytes">Bytes <small id="selection"></small></h2>
        <div id="hex"></div>
      </section>
      <section id="pane-problems" aria-labelledby="h-problems">
        <h2 id="h-problems">Problems</h2>
        <div id="problems"></div>
      </section>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
