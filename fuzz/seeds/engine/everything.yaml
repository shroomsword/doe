id: everything
meta:
  endian: le
enums:
  kind_t:
    "0": zero
    "0x10": sixteen
    "255": max
seq:
  - id: kind
    type: u1
    enum: kind_t
  - id: count
    type: u2
    valid:
      min: 0
      max: 65535
  - id: flags
    type: bits
    bit_size: 5
  - id: low_bits
    type: b3le
  - id: wide_bits
    type: b12
  - id: one_bit
    type: b1
  - id: items
    type: item
    repeat: expr
    repeat-expr: count % 8
  - id: len
    type: u1
    valid:
      expr: _ >= 0
  - id: blob
    type: bytes
    size: len
  - id: name
    type: str
    size: len % 4
    encoding: ascii
  - id: label
    type: strz
    encoding: utf8
  - id: legacy
    type: str
    size: 2
    encoding: latin1
  - id: signed
    type: s4be
  - id: wide
    type: u8
  - id: ratio
    type: f4
  - id: precise
    type: f8
  - id: extra
    type: u1
    if: kind == 16 || len > 3
  - id: until_zero
    type: u1
    repeat: until
    repeat-until: _ == 0
  - id: param_user
    type: sized_t(len % 4, kind == kind_t::sixteen)
  - id: framed_len
    type: u1
  - id: framed
    type: framed_t
    size: framed_len
  - id: choice
    type:
      switch-on: kind
      cases:
        0: item
        kind_t::sixteen: u2be
        255: framed_t
        _: bytes
    size: framed_len
  - id: rest
    type: u2
    repeat: eos
instances:
  doubled:
    value: len * 2
  first_byte:
    pos: 0
    type: u1
  after_len:
    pos: doubled % 8
    type: u2
    if: len > 3
types:
  item:
    seq:
      - id: a
        type: u1
      - id: b
        type: s2be
      - id: inner_len
        type: u1
      - id: inner
        type: bytes
        size: inner_len
  sized_t:
    params:
      - id: width
        type: u4
      - id: flag
        type: bool
    seq:
      - id: head
        type: bytes
        size: width
      - id: marker
        type: u1
        if: flag
  framed_t:
    seq:
      - id: tag
        type: u1
      - id: payload
        type: bytes
        size-eos: true
