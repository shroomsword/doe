id: seek
meta:
  endian: le
seq:
  - id: table_offset
    type: u2
  - id: table_count
    type: u1
  - id: blob_offset
    type: u1
  - id: blob_len
    type: u1
  - id: table
    type: entry
    pos: table_offset
    repeat: expr
    repeat-expr: table_count
  - id: blob
    type: bytes
    size: blob_len
    pos: blob_offset
    if: blob_len > 0
  - id: after
    type: u1
types:
  entry:
    seq:
      - id: key
        type: u2
      - id: where
        type: u1
      - id: pointed
        type: bytes
        size: 4
        pos: where
