    15: ebdt
    16: eblc
    17: gasp
    18: hdmx
    19: kern
    20: ltsh
    21: pclt
    22: vdmx
    23: vhea
    24: vmtx
    25: base
    26: gdef
    27: gpos
    28: gsub
