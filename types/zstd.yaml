id: zstd
doc: |
  Zstandard compressed file: the frames (data and skippable), with their headers, the blocks, and the literals and sequences headers of compressed blocks
# Covers: every frame in the file. A data frame has its magic, the frame header (the flags, the window descriptor decoded to
#   the window size, the dictionary id, the size of the content), its blocks - the header (last-block flag, type, size)
#   and the data - and the content checksum. A raw block's bytes and a run-length block's byte are shown as bytes; a compressed
#   block is read up to the entropy-coded tables: the literals section header (the literals block type - raw, RLE,
#   Huffman-compressed or treeless - the size format, the regenerated and compressed sizes) and the literals bytes, and the
#   number of sequences that follows. A skippable frame (magic 0x184D2A50 to 0x184D2A5F: a 4-byte size and the data) is told
#   apart, and the zstd seekable format's seek table (the skippable frame 0x184D2A5E that ends a seekable file) is read:
#   one entry for each frame with its compressed and decompressed sizes and, when the table has them, a checksum, and the
#   footer with the number of frames, the descriptor and the seekable magic.
# Limits: the literals' Huffman tree and streams, the sequences' table descriptions and their bit streams are entropy coded
#   and are bytes (`rest`). Nothing is decompressed.
# Specification: RFC 8878, "Zstandard Compression and the 'application/zstd' Media Type"; the seekable format is in the
#   zstd repository's `contrib/seekable_format/zstd_seekable_compression_format.md`.
meta:
  id: zstd
  endian: le
seq:
  - id: frames
    type: any_frame
    repeat: eos
enums:
  block_type:
    0: raw
    1: rle
    2: compressed
    3: reserved
  literals_type:
    0: raw
    1: rle
    2: compressed
    3: treeless
types:
  # a frame starts with its magic, which says which kind it is
  any_frame:
    seq:
      - id: body
        type:
          switch-on: kind
          cases:
            1: frame
            2: skippable_frame
    instances:
      lead:
        pos: _io.pos
        type: u4
      kind:
        value: 'lead == 0xfd2fb528 ? 1 : (lead & 0xfffffff0) == 0x184d2a50 ? 2 : 0'
        doc: 1 for a data frame, 2 for a skippable one.
  skippable_frame:
    seq:
      - id: magic
        type: u4
        valid:
          expr: (_ & 0xfffffff0) == 0x184d2a50
      - id: size
        type: u4
      - id: data
        size: size
        type:
          switch-on: magic
          cases:
            0x184d2a5e: seek_table
            _: skipped
    instances:
      number:
        value: magic & 15
        doc: The low four bits of the magic, which applications use to tell their frames apart.
  skipped:
    seq:
      - id: bytes
        size-eos: true
  # the zstd seekable format: the entries, then a footer of nine bytes
  seek_table:
    instances:
      footer:
        pos: _io.size - 9
        type: seek_table_footer
      has_checksums:
        value: (footer.descriptor & 0x80) != 0
      entries:
        pos: 0
        type: "seek_table_entry(has_checksums)"
        repeat: expr
        repeat-expr: footer.number_of_frames
  seek_table_footer:
    seq:
      - id: number_of_frames
        type: u4
      - id: descriptor
        type: u1
        doc: Bit 7 says each entry has a checksum; bits 2 to 6 are reserved.
      - id: seekable_magic
        contents: [0xb1, 0xea, 0x92, 0x8f]
  seek_table_entry:
    params:
      - id: has_checksum
        type: bool
    seq:
      - id: compressed_size
        type: u4
      - id: decompressed_size
        type: u4
      - id: checksum
        type: u4
        if: has_checksum
        doc: The low 32 bits of the XXH64 of the frame's content.
  frame:
    seq:
      - id: magic
        contents: [0x28, 0xb5, 0x2f, 0xfd]
      - id: frame_content_size_flag
        type: b2
      - id: single_segment
        type: b1
      - id: unused
        type: b1
      - id: reserved
        type: b1
      - id: has_content_checksum
        type: b1
      - id: dictionary_id_flag
        type: b2
      - id: window_descriptor
        type: u1
        if: single_segment == false
      - id: dictionary_id
        size: 'dictionary_id_flag == 3 ? 4 : dictionary_id_flag'
        if: dictionary_id_flag != 0
      - id: frame_content_size
        size: len_frame_content_size
        if: len_frame_content_size != 0
      - id: blocks
        type: block
        repeat: until
        repeat-until: _.last
      - id: content_checksum
        type: u4
        if: has_content_checksum
    instances:
      len_frame_content_size:
        value: >-
          frame_content_size_flag == 0 ? (single_segment ? 1 : 0) :
          frame_content_size_flag == 1 ? 2 :
          frame_content_size_flag == 2 ? 4 : 8
      window_size:
        value: ((1 << (10 + (window_descriptor >> 3))) / 8) * ((window_descriptor & 7) + 8)
        if: single_segment == false
        doc: >-
          The window in bytes: 2^(10 + exponent) plus mantissa eighths of it. For a single-segment frame the window is the size of the content.
  block:
    seq:
      - id: header_bytes
        size: 3
      - id: data
        size: len_data
        type:
          switch-on: block_type
          cases:
            2: compressed_block
    instances:
      header:
        value: header_bytes[0] + (header_bytes[1] << 8) + (header_bytes[2] << 16)
      last:
        value: (header & 1) == 1
      block_type:
        value: (header >> 1) & 3
      kind:
        value: (header >> 1) & 3
        enum: block_type
      block_size:
        value: header >> 3
        doc: For a raw or compressed block the size of its data; for a run-length block the length of the run.
      len_data:
        value: 'block_type == 1 ? 1 : block_size'
  # a compressed block: the literals section, then the sequences section, whose tables and bit streams are entropy coded
  compressed_block:
    seq:
      - id: literals
        type: literals_section
      - id: number_of_sequences
        type: sequence_count
      - id: rest
        size-eos: true
        doc: The sequences section after its first bytes - the symbol compression modes, the tables and the bit streams.
  literals_section:
    meta:
      bit-endian: le
    seq:
      - id: block_type
        type: b2
        enum: literals_type
      - id: size_format_low
        type: b1
      - id: size_format_high
        type: b1
        if: block_type > 1 or size_format_low
      - id: size_5
        type: b5
        if: block_type < 2 and not size_format_low
      - id: size_12
        type: b12
        if: block_type < 2 and size_format_low and not size_format_high
      - id: size_20
        type: b20
        if: block_type < 2 and size_format_low and size_format_high
      - id: regenerated_10
        type: b10
        if: block_type > 1 and not size_format_high
      - id: compressed_10
        type: b10
        if: block_type > 1 and not size_format_high
      - id: regenerated_14
        type: b14
        if: block_type > 1 and size_format_high and not size_format_low
      - id: compressed_14
        type: b14
        if: block_type > 1 and size_format_high and not size_format_low
      - id: regenerated_18
        type: b18
        if: block_type > 1 and size_format_high and size_format_low
      - id: compressed_18
        type: b18
        if: block_type > 1 and size_format_high and size_format_low
      - id: data
        size: len_data
    instances:
      regenerated_size:
        value: >-
          block_type < 2 ? (not size_format_low ? size_5 : not size_format_high ? size_12 : size_20) :
          not size_format_high ? regenerated_10 : not size_format_low ? regenerated_14 : regenerated_18
        doc: The size of the literals after decompression.
      len_data:
        value: >-
          block_type == 1 ? 1 :
          block_type == 0 ? regenerated_size :
          not size_format_high ? compressed_10 : not size_format_low ? compressed_14 : compressed_18
        doc: The bytes that follow the header - the literals themselves (raw), one byte (RLE) or the compressed streams.
      streams:
        value: 'block_type < 2 ? 1 : (not size_format_high and not size_format_low) ? 1 : 4'
        doc: The number of Huffman streams of a compressed literals section (a compressed section with a size format of 0 has one).
  sequence_count:
    seq:
      - id: first
        type: u1
      - id: second
        type: u1
        if: first >= 128
      - id: third
        type: u1
        if: first == 255
    instances:
      value:
        value: 'first == 0 ? 0 : first < 128 ? first : first < 255 ? ((first - 128) << 8) + second : second + (third << 8) + 32512'
