id: zstd
doc: |
  Zstandard compressed file: the frames, with their headers and the blocks as bytes
# Covers: every frame's magic, the frame header (the flags, the window size, the dictionary id, the size of the
#   content), the block headers (last-block flag, type, size) and the bytes of each block, and the content checksum.
# Limits: the blocks' compressed data (entropy-coded sequences) are bytes; skippable frames (magic 0x184D2A5?) are
#   not told apart. The window descriptor is the raw byte.
# Specification: RFC 8878, "Zstandard Compression and the 'application/zstd' Media Type".
meta:
  id: zstd
  endian: le
seq:
  - id: frames
    type: frame
    repeat: eos
enums:
  block_type:
    0: raw
    1: rle
    2: compressed
    3: reserved
types:
  frame:
    seq:
      - id: magic
        contents: [0x28, 0xb5, 0x2f, 0xfd]
      - id: frame_content_size_flag
        type: b2
      - id: single_segment
        type: b1
      - id: unused
        type: b1
      - id: reserved
        type: b1
      - id: has_content_checksum
        type: b1
      - id: dictionary_id_flag
        type: b2
      - id: window_descriptor
        type: u1
        if: single_segment == false
      - id: dictionary_id
        size: 'dictionary_id_flag == 3 ? 4 : dictionary_id_flag'
        if: dictionary_id_flag != 0
      - id: frame_content_size
        size: len_frame_content_size
        if: len_frame_content_size != 0
      - id: blocks
        type: block
        repeat: until
        repeat-until: _.last
      - id: content_checksum
        type: u4
        if: has_content_checksum
    instances:
      len_frame_content_size:
        value: >-
          frame_content_size_flag == 0 ? (single_segment ? 1 : 0) :
          frame_content_size_flag == 1 ? 2 :
          frame_content_size_flag == 2 ? 4 : 8
  block:
    seq:
      - id: header_bytes
        size: 3
      - id: data
        size: len_data
    instances:
      header:
        value: header_bytes[0] + (header_bytes[1] << 8) + (header_bytes[2] << 16)
      last:
        value: (header & 1) == 1
      block_type:
        value: (header >> 1) & 3
      block_size:
        value: header >> 3
        doc: For a raw or compressed block the size of its data; for a run-length block the length of the run.
      len_data:
        value: 'block_type == 1 ? 1 : block_size'
